[project]
name = "cpi-platform"
version = "0.1.0"
description = "Competitor Price & Availability Intelligence Platform"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.7.0",
    "structlog>=24.4.0",
    "httpx>=0.28.1",
    "tenacity>=9.0.0",
    "pandera>=0.21.0",
    "polars>=1.17.1",
    "pyarrow>=18.1.0",
    "python-dotenv>=1.0.1",
    "celery[redis]>=5.5.0",
    "statsforecast>=2.0.0",
    "pandas>=2.2.3",
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "redis>=5.2.1",
]

[project.optional-dependencies]
matching = [
    "fastembed>=0.5.0",
    "streamlit>=1.41.0",
]
ai = [
    "crewai>=0.100.0",
    "google-genai>=1.0.0",
]
aws = [
    "boto3>=1.35.0",
]
transform = [
    "dbt-core>=1.10.0",
    "dbt-postgres>=1.9.0",
]
dev = [
    "ruff>=0.8.4",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "respx>=0.22.0",
    "pre-commit>=4.0.1",
    "dbt-core>=1.10.0",
    "dbt-postgres>=1.9.0",
]

monitoring = [
    "flower>=2.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"scripts/build_report.py" = ["E501"]
"scripts/report_figures.py" = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path", "fastapi.Body",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
