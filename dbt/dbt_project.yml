name: cpi
version: "1.0.0"
config-version: 2

profile: cpi

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  cpi:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  cpi:
    +schema: seeds
    own_catalog:
      +column_types:
        match_upc: varchar
        our_sku: varchar
        currency: varchar
        our_price: numeric(12,2)

vars:
  min_observations_for_volatility: 3
  undercut_threshold: 1.0
