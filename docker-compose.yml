services:
  # Docker runs the stateful services only. Publishing a port to Windows localhost is
  # the one path that has proved reliable on this machine -- WSL-hosted services could
  # not be reached across the Hyper-V firewall, and Neon is blocked by the ISP on 5432.
  # See docs/adr/ADR-006.
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cpi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cpi_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-cpi}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cpi} -d ${POSTGRES_DB:-cpi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Worker and beat are opt-in containers, for exercising the production image.
  # Day to day they run from the local venv (`make worker` / `make beat`), which keeps
  # container count -- and memory -- to the two stateful services.
  worker:
    profiles: ["workers"]
    build: .
    # --concurrency=2 deliberately: this dev machine is RAM-constrained, and the work is
    # I/O-bound on upstream APIs whose rate limits are the real ceiling, not local CPU.
    command: celery -A app.celery_app worker -l info --concurrency=2 -Q ingest,default,maintenance
    environment: &app_env
      # Neon connection string, read from .env. Takes precedence over the POSTGRES_*
      # parts below, which remain as the offline fallback for the local-db profile.
      DATABASE_URL_OVERRIDE: ${DATABASE_URL_OVERRIDE:-}
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-cpi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cpi_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-cpi}
      REDIS_URL: redis://redis:6379/0
      BRONZE_LOCAL_PATH: /app/data/bronze
      DEADLETTER_LOCAL_PATH: /app/data/deadletter
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENV: ${ENV:-dev}
    volumes: ["./data:/app/data"]
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped

  beat:
    profiles: ["workers"]
    build: .
    command: celery -A app.celery_app beat -l info --schedule /tmp/celerybeat-schedule
    environment: *app_env
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped


  # Recruiter-facing BI, opt-in: `docker compose --profile bi up -d metabase`.
  # Metabase is a JVM and holds roughly 1GB, which is a lot on a 7.4GB machine, so it is
  # not part of the default stack. Connect it to db:5432 / cpi / analytics_marts.
  metabase:
    profiles: ["bi"]
    image: metabase/metabase:latest
    ports: ["3000:3000"]
    environment:
      MB_DB_TYPE: h2
      # Cap the heap only. Metabase is Clojure and loads a large number of classes;
      # capping metaspace (tried at 180m) kills it with OutOfMemoryError: Metaspace
      # before it finishes booting. Heap is the knob worth constraining here.
      JAVA_OPTS: -Xmx512m
    depends_on:
      db: {condition: service_healthy}

volumes:
  pgdata:
