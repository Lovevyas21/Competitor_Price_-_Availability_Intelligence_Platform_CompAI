name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  POSTGRES_USER: cpi
  POSTGRES_PASSWORD: cpi_ci
  POSTGRES_DB: cpi
  REDIS_URL: redis://localhost:6379/0

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cpi
          POSTGRES_PASSWORD: cpi_ci
          POSTGRES_DB: cpi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cpi -d cpi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv pip install --system -e ".[dev,matching,ai]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Unit and integration tests
        run: pytest -q

      - name: dbt build
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
        run: |
          dbt deps
          dbt build

  terraform:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        stack: [persistent, ephemeral]

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform format
        working-directory: infra/${{ matrix.stack }}
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: infra/${{ matrix.stack }}
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: infra/${{ matrix.stack }}
        run: terraform validate

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: cpi:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
