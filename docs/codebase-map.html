<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codebase Atlas</title>
<style>
:root{
  --bg:#ecebe5; --panel:#fbfaf6; --panel-2:#f3f1ea; --ink:#1c2025; --ink-2:#454b54; --muted:#767c85; --line:#d3d0c6;
  --rim-t:#e8d9ba; --rim-l:#d2bf99; --rim-r:#bca77f;
  --gr-t:#e5e6e1; --gr-l:#cdd0c9; --gr-r:#b6bab2;
  --un-t:#b3bcc3; --un-l:#98a3ac; --un-r:#838e98;
  --bd-t:#8b8f8c; --bd-l:#737775; --bd-r:#5f6361;
  --b-t:#fdfdfb; --b-l:#dcdfda; --b-r:#c5c9c2; --b-edge:#646a72;
  --s-t:#f1f3f5; --s-l:#cfd6dc; --s-r:#b5bec6;
  --road:#39414b; --road-case:#f6f5f0; --rail-tie:#f6f5f0;
  --fail:#b3423a; --recover:#2c7c69; --prov:#8a8f96;
  --accent:#1f5fe0; --accent-soft:rgba(31,95,224,.16); --accent-ink:#fff;
  --unv:#8b9098; --shadow:0 1px 2px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.08);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111316; --panel:#181b1f; --panel-2:#1f2328; --ink:#e7e9ec; --ink-2:#bcc1c8; --muted:#8a919a; --line:#2e333a;
    --rim-t:#4b4435; --rim-l:#3c3629; --rim-r:#322d22;
    --gr-t:#2c3035; --gr-l:#23262a; --gr-r:#1c1f22;
    --un-t:#20262c; --un-l:#1a1f24; --un-r:#15191d;
    --bd-t:#17191b; --bd-l:#131516; --bd-r:#0f1112;
    --b-t:#434a52; --b-l:#353b42; --b-r:#2b3036; --b-edge:#9aa2ac;
    --s-t:#3a434c; --s-l:#2f373f; --s-r:#262d34;
    --road:#c4cad2; --road-case:#1b1e22; --rail-tie:#1b1e22;
    --fail:#e3786f; --recover:#5cc0a6; --prov:#7c838c;
    --accent:#6ea2ff; --accent-soft:rgba(110,162,255,.2); --accent-ink:#0b1220;
    --unv:#7c838c; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.45 var(--sans);overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}

/* ---------- layout ---------- */
.bar{height:52px;display:flex;align-items:center;gap:16px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand b{font-size:14px;letter-spacing:.01em}
.brand span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl{margin-left:6px;padding:4px 10px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);font-size:12px;white-space:nowrap}
.lvl i{font-style:normal;color:var(--muted)}
.meta{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.tools{display:flex;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 10px;cursor:pointer;min-width:34px}
.btn:hover{background:var(--panel-2)}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip-unv{border:1px dashed var(--unv);color:var(--ink-2);background:transparent}
.stage{position:absolute;top:52px;left:0;right:0;bottom:0;display:flex;overflow:hidden}
.mapwrap{position:relative;flex:1;overflow:hidden;cursor:grab;touch-action:none;outline:none}
.mapwrap.dragging{cursor:grabbing}
.mapwrap:focus-visible{box-shadow:inset 0 0 0 3px var(--accent)}
svg#map{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ---------- terrain ---------- */
.t-rim .f-t{fill:var(--rim-t)} .t-rim .f-l{fill:var(--rim-l)} .t-rim .f-r{fill:var(--rim-r)}
.t-ground .f-t{fill:var(--gr-t)} .t-ground .f-l{fill:var(--gr-l)} .t-ground .f-r{fill:var(--gr-r)}
.t-under .f-t{fill:var(--un-t)} .t-under .f-l{fill:var(--un-l)} .t-under .f-r{fill:var(--un-r)}
.t-bedrock .f-t{fill:var(--bd-t)} .t-bedrock .f-l{fill:var(--bd-l)} .t-bedrock .f-r{fill:var(--bd-r)}
.strata .f-l{fill:var(--bd-l)} .strata .f-r{fill:var(--bd-r)}
.district .f-t{stroke:var(--b-edge);stroke-opacity:.35;stroke-width:1;vector-effect:non-scaling-stroke}
.district{cursor:pointer}
.district.sel .f-t{stroke:var(--accent);stroke-opacity:1;stroke-width:2.5}
.district:focus-visible{outline:none}
.district:focus-visible .f-t{stroke:var(--accent);stroke-opacity:1;stroke-width:3}

/* ---------- buildings ---------- */
.obj{cursor:pointer;transition:opacity .35s}
.obj .f-t{fill:var(--b-t)} .obj .f-l{fill:var(--b-l)} .obj .f-r{fill:var(--b-r)}
.obj path,.obj ellipse,.obj polygon{stroke:var(--b-edge);stroke-width:.7;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.obj.store .f-t{fill:var(--s-t)} .obj.store .f-l{fill:var(--s-l)} .obj.store .f-r{fill:var(--s-r)}
.obj.ext .f-t{fill:var(--rim-t)} .obj.ext .f-l{fill:var(--rim-l)} .obj.ext .f-r{fill:var(--rim-r)}
.obj .floors{stroke:var(--b-edge);stroke-opacity:.35;stroke-width:.6;fill:none;opacity:0;transition:opacity .3s}
#map.L3 .obj .floors{opacity:1}
.obj .hatch{fill:url(#hatch)} .obj .grid{fill:url(#gridp)} .obj .dots{fill:url(#dotp)}
.obj .ring{fill:none;stroke:transparent;stroke-width:3;vector-effect:non-scaling-stroke}
.obj.sel .ring,.obj:focus-visible .ring{stroke:var(--accent)}
.obj:focus-visible{outline:none}
/* SVG groups draw their own focus ring; Chrome otherwise adds a box on mouse focus too */
.obj:focus,.road:focus,.district:focus,.junction:focus{outline:none}
.obj.unv .f-t{fill:url(#unvp)}
.obj.dlq .band{stroke:var(--fail);stroke-width:2.2}
.phantom path{fill:none;stroke:var(--unv);stroke-dasharray:4 3;stroke-width:1.4}
.phantom .f-t{fill:var(--gr-t);fill-opacity:.4}
#map.L1 .obj.bld{opacity:0;pointer-events:none}
#map.L1 .obj.test,#map.L1 .obj.dbt{opacity:0;pointer-events:none}

/* ---------- roads ---------- */
.road{cursor:pointer}
.road .case{fill:none;stroke:var(--road-case);stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:.9}
.road .line{fill:none;stroke:var(--road);stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.road .flow{fill:none;stroke:var(--road-case);stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-dasharray:2 16;animation:flow 1.8s linear infinite;opacity:.9}
.road .chev{fill:var(--road);stroke:none}
.road.control .line{stroke-dasharray:none}
.road.control .ties{fill:none;stroke:var(--rail-tie);stroke-width:1.4;stroke-dasharray:1.5 5;vector-effect:non-scaling-stroke}
.road.failure .line{stroke:var(--fail);stroke-dasharray:7 5}
.road.failure .chev{fill:var(--fail)}
.road.recovery .line{stroke:var(--recover);stroke-dasharray:7 5}
.road.recovery .chev{fill:var(--recover)}
.road.provision .line{stroke:var(--prov);stroke-dasharray:1.5 4}
.road.provision .chev{display:none}
.road.unv .line{stroke:var(--unv);stroke-dasharray:3 4}
#map.L1 .road.lvl2{opacity:0;pointer-events:none}
.road.sel .line{stroke:var(--accent)}
.road:focus-visible{outline:none}
.road:focus-visible .case{stroke:var(--accent);opacity:.6}
@keyframes flow{to{stroke-dashoffset:-18}}
.lineage path{fill:none;stroke:var(--road);stroke-opacity:.55;stroke-width:1;stroke-dasharray:1.5 3;vector-effect:non-scaling-stroke}
#map.L1 .lineage{opacity:0}
.links path{fill:none;stroke:var(--accent);stroke-width:1.4;vector-effect:non-scaling-stroke;opacity:.8}
.links path.in{stroke-dasharray:5 3}
.links path.core{stroke:var(--muted);stroke-dasharray:2 3;opacity:.7}

/* ---------- trace / journey ---------- */
#map.tracing .obj:not(.on),#map.tracing .road:not(.on),#map.tracing .district{opacity:.32}
#map.tracing .district{opacity:.55}
.trace path{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:.9}
.trace path.halo{stroke:var(--accent-soft);stroke-width:14}
.trail path{fill:none;stroke:var(--accent);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.junction{cursor:pointer}
.junction .j{fill:var(--panel);stroke:var(--ink);stroke-width:1.4;vector-effect:non-scaling-stroke}
.junction.fail .j{stroke:var(--fail)}
.junction:focus-visible{outline:none}
.junction:focus-visible .j{stroke:var(--accent);stroke-width:3}
.plaza .pave{fill:var(--panel);stroke:var(--ink);stroke-width:2;vector-effect:non-scaling-stroke}
.plaza .inner{fill:none;stroke:var(--ink);stroke-opacity:.35;stroke-width:1;stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
.fork .ring1{fill:var(--panel);stroke:var(--ink);stroke-width:2.2;vector-effect:non-scaling-stroke}
.fork .ring2{fill:none;stroke:var(--accent);stroke-width:1.5;vector-effect:non-scaling-stroke;opacity:.7}
.fork .glyph{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.pulse{animation:pulse 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.1)}}
.term .j{fill:var(--panel);stroke:var(--fail);stroke-width:1.6;vector-effect:non-scaling-stroke}
.stopnum circle{fill:var(--accent)} .stopnum text{fill:var(--accent-ink);font:700 10px var(--sans);text-anchor:middle;dominant-baseline:central}
#map:not(.journeying) .stopnum{display:none}
.vehicle .body{fill:var(--accent);stroke:var(--panel);stroke-width:2.5}
.vehicle .cargo{fill:var(--accent-ink)}
.vehicle .halo{fill:var(--accent);opacity:.25}
.ghost .body{fill:var(--panel);stroke:var(--accent);stroke-width:2;stroke-dasharray:3 2}
.ghost .cargo{fill:var(--accent)}

/* ---------- labels ---------- */
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform;transition:opacity .2s;pointer-events:none}
.lb.hid{opacity:0;visibility:hidden}
.lb-d{font:650 17px/1.1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);text-shadow:0 0 3px var(--bg),0 0 6px var(--bg)}
.lb-d small{display:block;font:500 11px/1.2 var(--sans);letter-spacing:.02em;text-transform:none;color:var(--ink-2);margin-top:2px}
.lb-d.small{font-size:11.5px;color:var(--ink-2);opacity:.85}
.lb-d.small small{display:none}
.lb-b{font:600 11.5px/1.2 var(--sans);color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:1px 6px;border-radius:5px;box-shadow:var(--shadow)}
.lb-b .sum{display:block;font:500 10px/1.2 var(--mono);color:var(--muted);margin-top:1px}
.lb-b.lm{font-size:12.5px;font-weight:700;padding:2px 8px}
.lb-b.unv{border-style:dashed;border-color:var(--unv)}
.lb-b.dbt{font-weight:500;font-size:10.5px;font-family:var(--mono)}
.lb-b.test{font-weight:500;font-size:10px;font-family:var(--mono)}
.lb-b.phantom{border-style:dashed;color:var(--muted);font-weight:500}
.lb-r{font:600 11px/1.2 var(--sans);color:var(--ink);text-shadow:0 0 2px var(--bg),0 0 4px var(--bg),0 0 7px var(--bg);text-align:center}
.lb-r small{display:block;font:italic 500 10.5px/1.2 var(--sans);color:var(--ink-2)}
.lb-r.failure{color:var(--fail)} .lb-r.recovery{color:var(--recover)}
.lb-fork{opacity:1!important;font:800 13px/1.15 var(--sans);letter-spacing:.08em;color:var(--ink);background:var(--panel);border:2px solid var(--ink);border-radius:7px;padding:4px 9px;text-align:center;box-shadow:var(--shadow)}
.lb-fork small{display:block;font:500 10.5px/1.25 var(--sans);letter-spacing:0;color:var(--ink-2);max-width:210px;white-space:normal}
.lb-t{font:600 10.5px var(--sans);color:var(--fail);background:var(--panel);border:1px solid var(--fail);border-radius:5px;padding:1px 6px}
.board{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:6px 8px;font:11px/1.35 var(--sans);min-width:170px;max-width:300px}
.board h4{margin:0 0 4px;font:700 11.5px var(--sans);display:flex;justify-content:space-between;gap:8px}
.board h4 span{font-weight:500;color:var(--muted)}
.board ul{list-style:none;margin:0;padding:0}
.board li button{all:unset;cursor:pointer;display:flex;align-items:center;gap:5px;width:100%;padding:1px 2px;border-radius:4px;font-family:var(--mono);font-size:10.5px}
.board li button:hover,.board li button:focus-visible{background:var(--accent-soft);outline:none}
.board .more{color:var(--muted);font-size:10.5px;margin-top:2px}

/* ---------- badges ---------- */
.bdg{display:inline-block;font:700 9px/1 var(--sans);letter-spacing:.04em;padding:2px 4px;border-radius:3px;border:1px solid var(--ink-2);color:var(--ink-2);white-space:nowrap}
.bdg.entry{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.bdg.out{border-style:dashed}
.bdg.db,.bdg.http,.bdg.redis,.bdg.raw,.bdg.process{background:var(--panel-2)}

/* ---------- side panel ---------- */
.panel{width:368px;flex:0 0 368px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:4}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:10px 6px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabpane{flex:1;overflow:auto;padding:14px 16px 24px;min-height:0}
.tabpane[hidden]{display:none}
.tabpane h2{font-size:16px;margin:2px 0 4px;word-break:break-word}
.tabpane h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.path{font:12px var(--mono);color:var(--ink-2);word-break:break-all;background:var(--panel-2);padding:3px 6px;border-radius:5px;display:inline-block}
.kind{display:inline-block;font-size:11px;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-right:6px}
.muted{color:var(--muted)}
.note{border-left:3px solid var(--ink-2);background:var(--panel-2);padding:6px 9px;margin:8px 0;border-radius:0 6px 6px 0;font-size:12.5px}
.note.unv{border-left-color:var(--unv);border-left-style:dashed}
.flist{list-style:none;margin:0;padding:0}
.flist li{border-top:1px solid var(--line)}
.flist button{all:unset;display:block;width:100%;padding:6px 4px;cursor:pointer;border-radius:5px}
.flist button:hover,.flist button:focus-visible{background:var(--accent-soft);outline:none}
.fn{font:12px var(--mono);font-weight:600}
.fn .ln{font-weight:400;color:var(--muted);margin-left:4px}
.fdoc{font-size:11.5px;color:var(--ink-2);margin-top:2px}
.fbad{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.tbl{font:11px var(--mono);color:var(--ink-2)}
.linklist{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:5px}
.linklist button{border:1px solid var(--line);background:var(--panel-2);border-radius:5px;padding:2px 7px;cursor:pointer;font:11px var(--mono)}
.linklist button:hover{border-color:var(--accent)}
.hops{list-style:none;margin:0;padding:0;counter-reset:h}
.hops li{position:relative;padding:5px 0 5px 30px;border-left:2px solid var(--accent);margin-left:10px}
.hops li::before{counter-increment:h;content:counter(h);position:absolute;left:-11px;top:5px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 10px/20px var(--sans);text-align:center}
.hops li.sep{border-left-style:dashed}
.hops .hk{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hops .hv{font:12px var(--mono);word-break:break-word}
.hops button{all:unset;cursor:pointer;border-radius:4px}
.hops button:hover,.hops button:focus-visible{background:var(--accent-soft);outline:none}
.search{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel-2);color:var(--ink);font:inherit}
.idx{list-style:none;margin:6px 0 0;padding:0}
.idx > li > b{display:block;margin:12px 0 4px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.idx ul{list-style:none;margin:0;padding:0}
.idx button{all:unset;display:block;width:100%;cursor:pointer;padding:3px 6px;border-radius:5px;font:12px var(--mono)}
.idx button:hover,.idx button:focus-visible{background:var(--accent-soft);outline:none}
.idx button small{font-family:var(--sans);color:var(--muted);margin-left:5px}
.key{display:grid;grid-template-columns:54px 1fr;gap:8px 10px;align-items:center}
.key svg{width:54px;height:40px;overflow:visible}
.gl dt{font-weight:700;margin-top:8px} .gl dd{margin:1px 0 0;color:var(--ink-2)}
.unvlist li{margin:6px 0}

/* ---------- journey dock ---------- */
.dock{position:absolute;left:14px;bottom:14px;width:min(430px,calc(100% - 250px));background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;z-index:3}
.dock .ctl{display:flex;gap:6px;align-items:center}
.dock .ctl .title{font-weight:700;margin-right:auto}
.dock .stopline{margin-top:8px;display:flex;gap:8px;align-items:flex-start}
.dock .sn{flex:0 0 auto;min-width:54px;text-align:center;font:700 11px var(--sans);background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:4px 6px}
.dock .sn.end{background:var(--ink-2)}
.dock .st{font-weight:700}
.dock .sf{font:11.5px var(--mono);color:var(--ink-2);margin-top:2px;word-break:break-word}
.dock .sc{margin-top:4px;color:var(--ink);font-size:12.5px}
.dock .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.opt{border:1.5px solid var(--ink);background:var(--panel);border-radius:7px;padding:5px 9px;cursor:pointer;font-weight:600;font-size:12px}
.opt.failure{border-color:var(--fail);color:var(--fail);border-style:dashed}
.opt.recovery{border-color:var(--recover);color:var(--recover);border-style:dashed}
.opt.def{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt:hover{filter:brightness(1.05)}
.dock .hint{font-size:11px;color:var(--muted);margin-top:6px}
.follow{font-size:11.5px;color:var(--ink-2);display:flex;gap:4px;align-items:center}

/* ---------- minimap ---------- */
.mini{position:absolute;right:14px;bottom:14px;width:220px;height:124px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;z-index:3}
.mini svg{width:100%;height:100%;display:block;cursor:pointer}
.mini .vp{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5;vector-effect:non-scaling-stroke}
.mini .md{stroke:var(--b-edge);stroke-opacity:.3;stroke-width:.6;vector-effect:non-scaling-stroke}
.mini .mr{fill:none;stroke:var(--road);stroke-width:1;vector-effect:non-scaling-stroke;opacity:.6}
.mini .mv{fill:var(--accent)}
.mini .ml{fill:var(--ink)}
.mini:focus-within{outline:2.5px solid var(--accent);outline-offset:2px}

/* ---------- narrow screens ---------- */
.panelToggle{display:none}
@media (max-width:1100px){
  .meta{display:none}
  .panel{position:absolute;right:0;top:0;bottom:0;transform:translateX(100%);transition:transform .25s;box-shadow:var(--shadow)}
  .panel.open{transform:none}
  .panelToggle{display:inline-block}
  .dock{width:calc(100% - 28px);bottom:150px}
}
@media (max-width:720px){
  .brand span,.lvl i{display:none}
  .bar{gap:8px;padding:0 10px}
  .lvl{margin-left:0}
  .tools{margin-left:auto;gap:4px}
  .btn{padding:5px 8px;font-size:12.5px;white-space:nowrap}
  .brand b{font-size:13px;white-space:nowrap}
  /* On a phone the minimap costs more map than it saves; the dock takes its corner. */
  .mini{display:none}

<script>
"use strict";
/* ======================================================================
   Geometry. A grid cell projects to a 32x16 diamond; one unit of height
   is 7px. Everything is placed from MAP's fixed coordinates and nothing is
   ever laid out again: zooming only changes the view transform.
   ====================================================================== */
const HX = 16, HY = 8, ZH = 7, BASE = -11, STRATA = -7;
const P = (gx, gy, z = 0) => [(gx - gy) * HX, (gx + gy) * HY - z * ZH];
const SVGNS = "http://www.w3.org/2000/svg";
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, parent) => {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
};
const h = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const k in attrs) {
    if (k === "class") n.className = attrs[k];
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
    else n.setAttribute(k, attrs[k]);
  }
  for (const c of kids.flat()) if (c != null) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
};
const poly = pts => "M" + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join("L") + "Z";
const line = pts => "M" + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join("L");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

const svg = $("#map"), world = $("#world"), wrap = $("#mapwrap");
const G = { terrain: $("#terrain"), plaza: $("#plaza"), lineage: $("#lineage"), roads: $("#roads"), trail: $("#trail"),
  objects: $("#objects"), links: $("#links"), trace: $("#trace"), marks: $("#marks"), vehicles: $("#vehicles") };

const B = new Map(MAP.buildings.map(b => [b.id, b]));
const D = new Map(MAP.districts.map(d => [d.id, d]));
const R = new Map(MAP.routes.map(r => [r.id, r]));
const F = new Map();
for (const b of MAP.buildings) for (const f of b.funcs || []) F.set(f.id, Object.assign(f, { bid: b.id }));
const nameOf = b => b.name;

/* ---------------------------------------------------------------- terrain */
function slab(parent, gx0, gx1, gy0, gy1, zt, cls) {
  const g = el("g", { class: cls }, parent);
  const zMid = Math.max(Math.min(zt, STRATA), BASE);
  if (zt > zMid) {
    el("path", { class: "f-l", d: poly([P(gx0, gy1, zt), P(gx1, gy1, zt), P(gx1, gy1, zMid), P(gx0, gy1, zMid)]) }, g);
    el("path", { class: "f-r", d: poly([P(gx1, gy0, zt), P(gx1, gy1, zt), P(gx1, gy1, zMid), P(gx1, gy0, zMid)]) }, g);
  }
  const s = el("g", { class: "strata" }, g);
  el("path", { class: "f-l", d: poly([P(gx0, gy1, zMid), P(gx1, gy1, zMid), P(gx1, gy1, BASE), P(gx0, gy1, BASE)]) }, s);
  el("path", { class: "f-r", d: poly([P(gx1, gy0, zMid), P(gx1, gy1, zMid), P(gx1, gy1, BASE), P(gx1, gy0, BASE)]) }, s);
  const top = el("path", { class: "f-t", d: poly([P(gx0, gy0, zt), P(gx1, gy0, zt), P(gx1, gy1, zt), P(gx0, gy1, zt)]) }, g);
  return { g, top };
}
function isoSort(items) {
  // Painter's order for axis-aligned boxes seen from +x,+y,+z. Only pairs that
  // overlap on screen are ordered; ties fall back to depth.
  const behind = (a, b) => {
    if (a.x1 <= b.x0 + 1e-6) return true; if (b.x1 <= a.x0 + 1e-6) return false;
    if (a.y1 <= b.y0 + 1e-6) return true; if (b.y1 <= a.y0 + 1e-6) return false;
    if (a.z1 <= b.z0 + 1e-6) return true; if (b.z1 <= a.z0 + 1e-6) return false;
    return (a.x0 + a.y0) < (b.x0 + b.y0);
  };
  const n = items.length, indeg = new Array(n).fill(0), out = items.map(() => []);
  const sb = items.map(it => {
    const xs = [], ys = [];
    for (const [x, y] of [[it.x0, it.y0], [it.x1, it.y0], [it.x1, it.y1], [it.x0, it.y1]])
      for (const z of [it.z0, it.z1]) { const p = P(x, y, z); xs.push(p[0]); ys.push(p[1]); }
    return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
  });
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
    const a = sb[i], b = sb[j];
    if (a[2] <= b[0] || b[2] <= a[0] || a[3] <= b[1] || b[3] <= a[1]) continue;
    if (behind(items[i], items[j])) { out[i].push(j); indeg[j]++; } else { out[j].push(i); indeg[i]++; }
  }
  const depth = i => items[i].x0 + items[i].y0 + items[i].z0 * 0.01;
  const ready = [], res = [];
  for (let i = 0; i < n; i++) if (!indeg[i]) ready.push(i);
  while (res.length < n) {
    if (!ready.length) { // cycle: fall back to depth for the remainder
      const left = [...Array(n).keys()].filter(i => !res.includes(i)).sort((a, b) => depth(a) - depth(b));
      res.push(...left); break;
    }
    ready.sort((a, b) => depth(b) - depth(a));
    const i = ready.pop(); res.push(i);
    for (const j of out[i]) if (--indeg[j] === 0) ready.push(j);
  }
  return res.map(i => items[i]);
}

const districtEls = new Map();
function drawTerrain() {
  const items = MAP.districts.map(d => ({ d, x0: d.gx0, x1: d.gx1, y0: d.gy0, y1: d.gy1, z0: BASE, z1: d.z }));
  for (const it of isoSort(items)) {
    const d = it.d;
    const { g } = slab(G.terrain, d.gx0, d.gx1, d.gy0, d.gy1, d.z, "district t-" + d.terrain);
    g.setAttribute("tabindex", "0"); g.setAttribute("role", "button");
    g.setAttribute("aria-label", `${districtTitle(d)} district. ${d.blurb}`);
    g.dataset.district = d.id;
    districtEls.set(d.id, g);
  }
}
const RIM_SUB = { ports_w: "sources", ports_n: "messaging & model", ports_e: "viewers" };
const districtTitle = d => RIM_SUB[d.id] ? `${d.name} · ${RIM_SUB[d.id]}` : d.name;

/* ---------------------------------------------------------------- buildings */
const objEls = new Map();
function box(g, x0, y0, w, d, z0, hgt, cls = "") {
  const x1 = x0 + w, y1 = y0 + d, z1 = z0 + hgt;
  el("path", { class: "f-l " + cls, d: poly([P(x0, y1, z1), P(x1, y1, z1), P(x1, y1, z0), P(x0, y1, z0)]) }, g);
  el("path", { class: "f-r " + cls, d: poly([P(x1, y0, z1), P(x1, y1, z1), P(x1, y1, z0), P(x1, y0, z0)]) }, g);
  return el("path", { class: "f-t " + cls, d: poly([P(x0, y0, z1), P(x1, y0, z1), P(x1, y1, z1), P(x0, y1, z1)]) }, g);
}
function floors(g, x0, y0, w, d, z0, hgt) {
  const x1 = x0 + w, y1 = y0 + d, parts = [];
  for (let z = z0 + 1.3; z < z0 + hgt - 0.4; z += 1.3)
    parts.push(line([P(x0, y1, z), P(x1, y1, z), P(x1, y0, z)]));
  if (parts.length) el("path", { class: "floors", d: parts.join(" ") }, g);
}
function pyramid(g, x0, y0, w, d, z1, rh) {
  const x1 = x0 + w, y1 = y0 + d, apex = P(x0 + w / 2, y0 + d / 2, z1 + rh);
  el("path", { class: "f-l", d: poly([P(x0, y1, z1), P(x1, y1, z1), apex]) }, g);
  el("path", { class: "f-r", d: poly([P(x1, y0, z1), P(x1, y1, z1), apex]) }, g);
}
function cylinder(g, cx, cy, z0, hgt, r, opts = {}) {
  const [x, yb] = P(cx, cy, z0), yt = yb - hgt * ZH;
  const rx = r * HX * Math.SQRT2, ry = r * HY * Math.SQRT2;
  el("path", { class: "f-l", d: `M${x - rx} ${yt}L${x - rx} ${yb}A${rx} ${ry} 0 0 0 ${x} ${yb + ry}L${x} ${yt + ry}A${rx} ${ry} 0 0 1 ${x - rx} ${yt}Z` }, g);
  el("path", { class: "f-r", d: `M${x} ${yt + ry}L${x} ${yb + ry}A${rx} ${ry} 0 0 0 ${x + rx} ${yb}L${x + rx} ${yt}A${rx} ${ry} 0 0 1 ${x} ${yt + ry}Z` }, g);
  for (const f of opts.bands || []) {
    const yh = yb - hgt * ZH * f;
    el("path", { class: "band", fill: "none", d: `M${x - rx} ${yh}A${rx} ${ry} 0 0 0 ${x + rx} ${yh}` }, g);
  }
  if (opts.dome) {
    el("path", { class: "f-t", d: `M${x - rx} ${yt}A${rx} ${ry * 2.4} 0 0 1 ${x + rx} ${yt}A${rx} ${ry} 0 0 1 ${x - rx} ${yt}Z` }, g);
  }
  const top = el("ellipse", { class: "f-t", cx: x, cy: yt, rx, ry }, g);
  if (opts.ring) el("ellipse", { class: "band", fill: "none", cx: x, cy: yt, rx: rx * 0.72, ry: ry * 0.72 }, g);
  return top;
}
function drawObject(b) {
  const g = el("g", { class: "obj", tabindex: "0", role: "button" }, G.objects);
  g.dataset.id = b.id;
  const cls = { module: "bld", scheduler: "bld", blueprint: "bld", infra: "bld", dbt: "dbt", seed: "dbt",
    test: "test", phantom: "bld phantom", external: "ext", datastore: "store" }[b.kind];
  g.setAttribute("class", "obj " + cls + (b.unverified ? " unv" : "") + (b.id === "lm:dlq" ? " dlq" : ""));
  g.setAttribute("aria-label", `${b.name}${b.path ? " (" + b.path + ")" : ""}. ${b.purpose}`);
  const { gx: x0, gy: y0, w, d, z0, h: hg } = b;
  // footprint ring for selection/focus
  el("path", { class: "ring", d: poly([P(x0 - .25, y0 - .25, z0), P(x0 + w + .25, y0 - .25, z0), P(x0 + w + .25, y0 + d + .25, z0), P(x0 - .25, y0 + d + .25, z0)]) }, g);
  switch (b.kind) {
    case "scheduler": {
      box(g, x0 + .3, y0 + .3, w - .6, d - .6, z0, hg);
      pyramid(g, x0 + .3, y0 + .3, w - .6, d - .6, z0 + hg, 2.2);
      const c = P(x0 + w / 2, y0 + d - .3, z0 + hg - 1.6);
      el("ellipse", { cx: c[0] - 3, cy: c[1] + 1, rx: 4.5, ry: 4.5, fill: "var(--panel)" }, g);
      el("path", { d: `M${c[0] - 3} ${c[1] + 1}v-3M${c[0] - 3} ${c[1] + 1}h2.5`, fill: "none" }, g);
      break;
    }
    case "datastore": {
      const r = Math.min(w, d) / 2, cx = x0 + w / 2, cy = y0 + d / 2;
      if (b.id === "lm:raw") cylinder(g, cx, cy, z0, hg, r, { dome: true, bands: [.33, .66] });
      else if (b.id === "lm:postgres") cylinder(g, cx, cy, z0, hg, r, { bands: [.33, .66] });
      else cylinder(g, cx, cy, z0, hg, r, { ring: b.id === "lm:dlq", bands: b.id === "lm:dlq" ? [.9] : [.5] });
      break;
    }
    case "external": {
      box(g, x0, y0, w, d, z0, .9);
      const py = y0 + d - .7, zt = z0 + .9;
      box(g, x0 + .35, py - .35, .45, .45, zt, hg);
      box(g, x0 + w - .8, py - .35, .45, .45, zt, hg);
      box(g, x0 + .35, py - .35, w - .7, .45, zt + hg - .45, .45);
      break;
    }
    case "dbt": case "seed": {
      const t = box(g, x0, y0, w, d, z0, hg, b.kind === "seed" ? "dots" : "");
      if (b.kind === "dbt") {
        const n = { staging: 1, intermediate: 2, marts: 3 }[b.layer] || 0;
        for (let i = 1; i <= n; i++) {
          const f = i / (n + 1);
          el("path", { d: line([P(x0 + .3, y0 + d * f, z0 + hg), P(x0 + w - .3, y0 + d * f, z0 + hg)]), fill: "none" }, g);
        }
      }
      break;
    }
    case "test": {
      const s = .5;
      box(g, x0 + s / 2, y0 + s / 2, w - s, d - s, z0, hg);
      pyramid(g, x0 + s / 2, y0 + s / 2, w - s, d - s, z0 + hg, .9);
      break;
    }
    case "phantom": {
      el("path", { class: "f-t", d: poly([P(x0, y0, z0 + .05), P(x0 + w, y0, z0 + .05), P(x0 + w, y0 + d, z0 + .05), P(x0, y0 + d, z0 + .05)]) }, g);
      break;
    }
    case "infra": box(g, x0, y0, w, d, z0, hg, "hatch"); break;
    case "blueprint": box(g, x0, y0, w, d, z0, hg, "grid"); break;
    default: {
      box(g, x0, y0, w, d, z0, hg);
      floors(g, x0, y0, w, d, z0, hg);
    }
  }

  return g;
}
function drawObjects() {
  const items = MAP.buildings.map(b => {
    const extra = b.kind === "external" ? 0 : 0, top = b.z0 + b.h + (b.kind === "scheduler" ? 2.2 : b.kind === "test" ? .9 : 0);
    return { b, x0: b.gx, x1: b.gx + b.w, y0: b.gy, y1: b.gy + b.d, z0: b.z0, z1: top + extra };
  });
  for (const it of isoSort(items)) drawObject(it.b);
}

/* ---------------------------------------------------------------- roads */
const roadEls = new Map(), roadPts = new Map();
function projPts(pts) { return pts.map(p => P(p[0], p[1], p[2])); }
function segLen(a, b) { return Math.hypot(b[0] - a[0], b[1] - a[1]); }
function chevrons(pts, every) {

    h("h2", {}, f.q), h("div", {}, h("span", { class: "path" }, `${B.get(f.bid).path}:${f.line}`)),

      h("button", { class: "hv", onclick: () => x.fid ? startTrace(x.fid) : x.at && B.get(x.at) ? selectBuilding(x.at, true) : null }, x.v)))),
    h("p", { class: "muted" }, "Upstream is the shortest caller chain to something that starts work. Downstream follows calls that leave the file or do I/O. Surfaces are functions that read what this journey stored, directly or after dbt rebuilds the marts."),

/* ---------------------------------------------------------------- journey */
const J = MAP.journey, NODES = J.nodes;
const vehicles = [];
function makeVehicle(cls) {
  const g = el("g", { class: cls }, G.vehicles);
  if (cls === "vehicle" && !reduced) el("circle", { class: "halo pulse", r: 12 }, g);
  el("rect", { class: "body", x: -10, y: -7, width: 20, height: 14, rx: 7 }, g);
  el("rect", { class: "cargo", x: -3.5, y: -3.5, width: 7, height: 7, rx: 1.5 }, g);
  const v = { g, x: 0, y: 0 }; vehicles.push(v); return v;
}
function placeVehicle(v) { v.g.setAttribute("transform", `translate(${v.x.toFixed(1)} ${v.y.toFixed(1)}) scale(${(1 / view.k).toFixed(4)})`); }
const vehicleAt = id => { const a = anchorOf(id); const p = P(a[0], a[1], a[2]); return [p[0], p[1] - 6]; };
function legPoints(legs, start) {
  let pts = [start];
  for (const [rid, dir] of legs) {
    let rp = (roadPts.get(rid) || []).map(p => [p[0], p[1] - 6]);
    if (rid === "wait_loop") rp = rp.concat([rp[0]]);

}

}

function startJourneyAt(id) {

function setPlaying(p) { jPlaying = p; $("#jPlay").textContent = p ? "Pause" : "Play"; $("#jPlay").setAttribute("aria-label", p ? "Pause" : "Play"); }
$("#jPlay").onclick = () => {
  stopTrace();
  // startJourney resets state (including play), so turn play on after it.

function stopJourney(keepDock) { clearTimeout(jTimer); setPlaying(false); }

  G.trail.replaceChildren(); svg.classList.remove("journeying");

  $("#jOpts").replaceChildren(); $("#jHint").textContent = reduced ? "Reduced motion is on: the vehicle jumps between stops and each leg is drawn in place." : "";

setInterval(placeVehicleMini, 120);
