name: deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm'
        required: true
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        if: ${{ inputs.confirm != 'deploy' }}
        run: |
          echo "::error::Confirmation text did not match; refusing to deploy."
          exit 1

  deploy:
    needs: guard
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
          platforms: linux/arm64

      - name: Roll out on the host
        run: |
          aws ssm send-command \
            --instance-ids "${{ vars.APP_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${{ github.sha }}" \
            --parameters commands='[
              "set -euo pipefail",
              "/usr/local/bin/cpi-fetch-env",
              "cd /srv/cpi",
              "export COMPOSE=\"docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile workers\"",
              "$COMPOSE pull",
              "$COMPOSE run --rm api alembic upgrade head",
              "$COMPOSE up -d",
              "docker image prune -f"
            ]' \
            --query "Command.CommandId" --output text
